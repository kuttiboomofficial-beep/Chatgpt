<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="description" content="SHREE JI CONNECT - Customer CRM, Orders, Production, WhatsApp and Reports">
<title>SHREE JI CONNECT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#171717}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 16px;background:#111;color:#fff;cursor:pointer;font-weight:600}
button.orange{background:#f47b00}button.green{background:#198c43}button.red{background:#c62828}button.light{background:#eee;color:#222}
header{background:#111;color:#fff;padding:18px 26px;border-bottom:5px solid #f47b00;position:sticky;top:0;z-index:10}
#brand{font-size:24px;font-weight:800}#subtitle{color:#bbb;margin-top:5px}
nav{display:flex;gap:10px;overflow-x:auto;white-space:nowrap;background:#fff;padding:10px;border-bottom:1px solid #ddd}
nav button{background:#eee;color:#333;padding:12px 18px;border-radius:13px}nav button.active{background:#f47b00;color:#fff}
main{max-width:1400px;margin:auto;padding:18px}section{display:none}section.active{display:block}
h2{font-size:30px;margin:8px 0 20px}h3{margin-top:4px}
.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0000000c}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px}
.kpi{font-size:30px;font-weight:800;margin-top:8px}.muted{color:#777;font-size:14px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
label{display:block;font-size:14px;font-weight:700;margin:6px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #d2d2d2;border-radius:10px;background:#fff}
textarea{resize:vertical}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:11px;border-bottom:1px solid #e8e8e8;text-align:left}th{background:#f6f6f6}
.status{display:inline-block;padding:6px 10px;border-radius:18px;font-size:12px;font-weight:700}
.s-Pending{background:#fff3cd;color:#856404}.s-Started{background:#cfe2ff;color:#084298}
.s-Finished{background:#d1e7dd;color:#0f5132}.s-Delivered{background:#d1e7dd;color:#146c43}.s-Cancelled{background:#f8d7da;color:#842029}
.hero{background:#111;color:#fff;border-radius:22px;padding:26px;margin-bottom:18px}.hero .big{font-size:22px;font-weight:800}.hero p{color:#ccc;font-size:17px}
.modalbg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:12px;z-index:30}.modalbg.show{display:flex}
.modal{width:min(900px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:24px;display:none;z-index:50}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){header{padding:15px 18px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.grid,.tiles{grid-template-columns:1fr 1fr}main{padding:12px}h2{font-size:26px}.card{padding:14px}}
</style>
</head>
<body>
<header><div id="brand">SHREE JI GOLD CREATOR LLP</div><div id="subtitle">Customer CRM • Orders • Production • WhatsApp • Reports</div></header>
<nav id="nav"></nav>
<main>
<section id="dashboard"></section><section id="customers"></section><section id="orders"></section>
<section id="production"></section><section id="reports"></section><section id="whatsapp"></section>
<section id="templates"></section><section id="exhibitions"></section><section id="backup"></section><section id="settings"></section>
</main>
<div id="modalbg" class="modalbg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='sjc_business_v3';
const STATUS=['Pending','Started','Finished','Delivered','Cancelled'];
const defaults={settings:{company:'SHREE JI GOLD CREATOR LLP',subtitle:'Customer CRM • Orders • Production • WhatsApp • Reports',phone:'',address:'',country:'91',defaultType:'Direct',defaultStatus:'Pending',version:'3.0.0'},customers:[],orders:[],exhibitions:[],templates:[
{id:'confirm',name:'Order Received Thank You',body:'Dear {{name}},\\n\\nThank you for your valuable order.\\nOrder: {{order}}\\nWeight: {{weight}}g\\n\\nThank you.'},
{id:'started',name:'Order Started',body:'Dear {{name}},\\n\\nYour order {{order}} has been started.\\nWeight: {{weight}}g\\nStatus: {{status}}\\n\\nThank you.'},
{id:'finished',name:'Order Finished',body:'Dear {{name}},\\n\\nYour order {{order}} has been finished.\\nStatus: {{status}}\\n\\nThank you.'},
{id:'ready',name:'Order Ready',body:'Dear {{name}},\\n\\nYour order {{order}} is ready for delivery.\\n\\nThank you.'},
{id:'delivery',name:'Delivery Update',body:'Dear {{name}},\\n\\nYour order {{order}} status is {{status}}.\\n\\nThank you.'}
]};
let db=load(),current='dashboard';
function $(id){return document.getElementById(id)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?{...defaults,...x,settings:{...defaults.settings,...x.settings},templates:x.templates||defaults.templates}:structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{$('toast').style.display='none'},1800)}
function cust(id){return db.customers.find(x=>String(x.id)===String(id))||{name:'Unknown',shop:'',mobile:'',city:'',state:'',address:''}}
function ord(id){return db.orders.find(x=>String(x.id)===String(id))}
function fmt(n){return Number(n||0).toFixed(3)}
function badge(s){s=s||'Pending';return '<span class="status s-'+esc(s)+'">'+esc(s)+'</span>'}
function nav(){
let a=[['dashboard','Dashboard'],['customers','Customer CRM'],['orders','Order Management'],['production','Production'],['reports','Reports'],['whatsapp','WhatsApp'],['templates','Templates'],['exhibitions','Exhibitions'],['backup','Backup'],['settings','Settings']];
$('nav').innerHTML=a.map(x=>'<button class="'+(current===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')
}
function go(id){current=id;document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');nav();renderAll()}
function modal(title,body){$('modal').innerHTML='<h2>'+esc(title)+'</h2>'+body+'<div class="actions"><button class="light" onclick="closeModal()">Close</button></div>';$('modalbg').classList.add('show')}
function closeModal(){$('modalbg').classList.remove('show')}
function totals(){let z={weight:0};STATUS.forEach(s=>z[s.toLowerCase()]=0);db.orders.forEach(o=>{z.weight+=+o.weight||0;z[(o.status||'Pending').toLowerCase()]++});return z}
function renderDashboard(){
let t=totals();
$('dashboard').innerHTML='<div class="hero"><div class="big">'+esc(db.settings.company)+'</div><p>'+esc(db.settings.subtitle)+'</p></div><h2>Dashboard</h2><div class="grid">'+
[['Total Customers',db.customers.length],['Total Orders',db.orders.length],['Direct / SM',db.orders.filter(o=>o.type==='Direct').length+' / '+db.orders.filter(o=>o.type==='SM').length],['Total Weight',fmt(t.weight)+' g'],['Pending',t.pending],['Started',t.started],['Finished',t.finished],['Delivered',t.delivered],['Cancelled',t.cancelled]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="kpi">'+x[1]+'</div></div>').join('')+
'</div><div class="card"><h2 style="font-size:22px">Quick Actions</h2><div class="actions"><button class="orange" onclick="openCustomer()">+ Customer</button><button class="orange" onclick="openOrder()">+ Order</button><button class="green" onclick="go(\'whatsapp\')">WhatsApp</button><button onclick="go(\'reports\')">Reports</button></div></div>'
}
function openCustomer(id){
let c=id?cust(id):{name:'',shop:'',mobile:'',alt:'',city:'',state:'',address:'',notes:''};
modal(id?'Edit Customer':'New Customer','<div class="formgrid"><div><label>Customer Name *</label><input id="cn" value="'+esc(c.name)+'"></div><div><label>Mobile *</label><input id="cm" value="'+esc(c.mobile)+'"></div><div><label>Shop Name</label><input id="cs" value="'+esc(c.shop)+'"></div><div><label>Alternate Mobile</label><input id="ca" value="'+esc(c.alt)+'"></div><div><label>City</label><input id="cc" value="'+esc(c.city)+'"></div><div><label>State</label><input id="cstate" value="'+esc(c.state)+'"></div><div class="full"><label>Full Address</label><textarea id="caddr" rows="3">'+esc(c.address)+'</textarea></div><div class="full"><label>Notes</label><textarea id="cnotes">'+esc(c.notes)+'</textarea></div></div><div class="actions"><button class="orange" onclick="saveCustomer('+(id||0)+')">Save Customer</button></div>')
}
function saveCustomer(id){
let x={name:$('cn').value.trim(),mobile:$('cm').value.trim(),shop:$('cs').value.trim(),alt:$('ca').value.trim(),city:$('cc').value.trim(),state:$('cstate').value.trim(),address:$('caddr').value.trim(),notes:$('cnotes').value.trim()};
if(!x.name||!x.mobile)return toast('Name and mobile required');
if(id)Object.assign(cust(id),x);else db.customers.push({id:Date.now(),...x,dateAdded:new Date().toISOString().slice(0,10)});
save();closeModal();renderAll();toast('Customer saved')
}
function renderCustomers(){
let q=($('cq')?.value||'').toLowerCase(),a=db.customers.filter(c=>(c.name+' '+c.shop+' '+c.mobile+' '+c.city+' '+c.state).toLowerCase().includes(q));
$('customers').innerHTML='<h2>Customer CRM</h2><div class="actions"><button class="orange" onclick="openCustomer()">+ New Customer</button><input id="cq" placeholder="Search customer / shop / mobile / city" value="'+esc(q)+'" oninput="renderCustomers()"></div><div class="card tablewrap">'+(a.length?'<table><tr><th>Customer</th><th>Shop</th><th>Mobile</th><th>City</th><th>Orders</th><th>Actions</th></tr>'+a.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.shop)+'</td><td>'+esc(c.mobile)+'</td><td>'+esc(c.city)+'</td><td>'+db.orders.filter(o=>o.customerId==c.id).length+'</td><td><button class="light" onclick="openCustomer('+c.id+')">Edit</button><button class="red" onclick="deleteCustomer('+c.id+')">Delete</button></td></tr>').join('')+'</table>':'<div class="muted">No customers found</div>')+'</div>'
}
function deleteCustomer(id){if(confirm('Delete customer?')){db.customers=db.customers.filter(c=>c.id!=id);save();renderAll()}}
function openOrder(id){
if(!db.customers.length)return toast('Add a customer first');
let o=id?ord(id):{orderNo:'SJ-'+new Date().getFullYear()+'-'+String(db.orders.length+1).padStart(4,'0'),orderDate:new Date().toISOString().slice(0,10),customerId:db.customers[0].id,type:db.settings.defaultType,status:'Pending',weight:'',touch:'',screw:'',ladyRing:'',gentRing:'',huid:'Yes',advanceMode:'Cash',advanceAmount:'',startDate:'',delivered:'',exhibitionId:'',notes:''};
modal(id?'Edit Order':'New Order','<div class="formgrid"><div><label>Order Number *</label><input id="ono" value="'+esc(o.orderNo)+'"></div><div><label>Order Date *</label><input id="od" type="date" value="'+esc(o.orderDate)+'"></div><div><label>Customer *</label><select id="oc">'+db.customers.map(c=>'<option value="'+c.id+'" '+(c.id==o.customerId?'selected':'')+'>'+esc(c.name)+' — '+esc(c.mobile)+'</option>').join('')+'</select></div><div><label>Exhibition</label><select id="oex"><option value="">-- None --</option>'+db.exhibitions.map(e=>'<option value="'+e.id+'" '+(e.id==o.exhibitionId?'selected':'')+'>'+esc(e.name)+'</option>').join('')+'</select></div><div><label>Order Type *</label><select id="ot"><option '+(o.type==='Direct'?'selected':'')+'>Direct</option><option '+(o.type==='SM'?'selected':'')+'>SM</option></select></div><div><label>Weight (g) *</label><input id="ow" type="number" step=".001" value="'+esc(o.weight)+'"></div><div><label>Touch *</label><input id="touch" value="'+esc(o.touch)+'"></div><div><label>Screw Type</label><input id="screw" value="'+esc(o.screw)+'"></div><div><label>Lady\'s Ring Size</label><input id="lr" value="'+esc(o.ladyRing)+'"></div><div><label>Gent\'s Ring Size</label><input id="gr" value="'+esc(o.gentRing)+'"></div><div><label>HUID</label><select id="huid"><option '+(o.huid!=='No'?'selected':'')+'>Yes</option><option '+(o.huid==='No'?'selected':'')+'>No</option></select></div><div><label>Advance Mode</label><select id="am"><option '+(o.advanceMode==='Cash'?'selected':'')+'>Cash</option><option '+(o.advanceMode==='Gpay'?'selected':'')+'>Gpay</option><option '+(o.advanceMode==='Bank'?'selected':'')+'>Bank</option></select></div><div><label>Advance Amount (₹)</label><input id="adv" type="number" step=".01" value="'+esc(o.advanceAmount)+'"></div><div><label>Start Date</label><input id="sd" type="date" value="'+esc(o.startDate)+'"></div><div><label>Status</label><select id="orderStatus">'+STATUS.map(s=>'<option value="'+s+'" '+((o.status||'Pending')===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div><label>Delivered Date</label><input id="dd" type="date" value="'+esc(o.delivered)+'"></div><div class="full"><label>Notes</label><textarea id="onotes" rows="3">'+esc(o.notes)+'</textarea></div></div><div class="actions"><button class="orange" onclick="saveOrder('+(id||0)+')">Save Order</button></div>')
}
function saveOrder(id){
let x={orderNo:$('ono').value.trim(),orderDate:$('od').value,customerId:Number($('oc').value),exhibitionId:$('oex').value?Number($('oex').value):'',type:$('ot').value,weight:Number($('ow').value)||0,touch:$('touch').value.trim(),screw:$('screw').value.trim(),ladyRing:$('lr').value.trim(),gentRing:$('gr').value.trim(),huid:$('huid').value,advanceMode:$('am').value,advanceAmount:Number($('adv').value)||0,startDate:$('sd').value,status:String($('orderStatus').value),delivered:$('dd').value,notes:$('onotes').value.trim()};
if(!x.orderNo||!x.orderDate||!x.weight||!x.touch)return toast('Order No, date, weight and touch are required');
let target=id?ord(id):null;
if(target)Object.assign(target,x);else{target={id:Date.now(),...x};db.orders.push(target)}
if(target.status==='Delivered'&&!target.delivered)target.delivered=new Date().toISOString().slice(0,10);
save();closeModal();renderAll();toast('Order saved as '+target.status)
}
function setStatus(id,s){
let o=ord(id);if(!o)return toast('Order not found');
o.status=STATUS.includes(s)?s:'Pending';
if(o.status==='Delivered'&&!o.delivered)o.delivered=new Date().toISOString().slice(0,10);
save();renderAll();toast('Status updated: '+o.status)
}
function deleteOrder(id){if(confirm('Delete this order?')){db.orders=db.orders.filter(o=>o.id!=id);save();renderAll()}}
function copyOrder(id){let o=ord(id),c=cust(o.customerId);let s='Order: '+o.orderNo+'\\nCustomer: '+c.name+'\\nMobile: '+c.mobile+'\\nType: '+o.type+'\\nWeight: '+o.weight+' g\\nTouch: '+o.touch+'\\nStatus: '+o.status;navigator.clipboard?.writeText(s);toast('Order copied')}
function renderOrders(){
let q=($('oq')?.value||'').toLowerCase(),type=$('ofType')?.value||'',st=$('ofStatus')?.value||'',a=db.orders.filter(o=>(o.orderNo+' '+cust(o.customerId).name+' '+cust(o.customerId).shop+' '+cust(o.customerId).mobile+' '+o.status).toLowerCase().includes(q)&&(!type||o.type===type)&&(!st||o.status===st));
$('orders').innerHTML='<h2>Order Management</h2><div class="actions"><button class="orange" onclick="openOrder()">+ Manual Order</button><input id="oq" placeholder="Search order / customer / shop / mobile" value="'+esc(q)+'" oninput="renderOrders()"><select id="ofType" onchange="renderOrders()"><option value="">All Types</option><option '+(type==='Direct'?'selected':'')+'>Direct</option><option '+(type==='SM'?'selected':'')+'>SM</option></select><select id="ofStatus" onchange="renderOrders()"><option value="">All Status</option>'+STATUS.map(s=>'<option '+(st===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="card tablewrap">'+(a.length?'<table><tr><th>Order</th><th>Date</th><th>Party</th><th>Type</th><th>Weight</th><th>Status</th><th>Actions</th></tr>'+a.slice().reverse().map(o=>'<tr><td>'+esc(o.orderNo)+'</td><td>'+esc(o.orderDate)+'</td><td>'+esc(cust(o.customerId).name)+'</td><td>'+esc(o.type)+'</td><td>'+fmt(o.weight)+'g</td><td>'+badge(o.status)+'</td><td><button class="light" onclick="openOrder('+o.id+')">Edit</button><button onclick="copyOrder('+o.id+')">Copy</button><button class="green" onclick="openWA('+o.customerId+','+o.id+')">WA</button><button class="red" onclick="deleteOrder('+o.id+')">Delete</button></td></tr>').join('')+'</table>':'<div class="muted">No orders found</div>')+'</div>'
}
function productionBlock(type){
let a=db.orders.filter(o=>o.type===type);
return '<div class="card"><h3>'+type+' Production</h3><div class="grid">'+STATUS.map(s=>'<div class="tile"><div class="muted">'+s+'</div><div class="kpi">'+a.filter(o=>o.status===s).length+'</div></div>').join('')+'</div><div class="tablewrap"><table><tr><th>Order</th><th>Customer</th><th>Weight</th><th>Touch</th><th>Status</th></tr>'+(a.length?a.map(o=>'<tr><td>'+esc(o.orderNo)+'</td><td>'+esc(cust(o.customerId).name)+'</td><td>'+fmt(o.weight)+'g</td><td>'+esc(o.touch)+'</td><td><select onchange="setStatus('+o.id+',this.value)">'+STATUS.map(s=>'<option value="'+s+'" '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join(''):'<tr><td colspan="5">No orders</td></tr>')+'</table></div></div>'
}
function renderProduction(){$('production').innerHTML='<h2>Production</h2>'+productionBlock('Direct')+productionBlock('SM')}
function renderReports(){
let t=totals();$('reports').innerHTML='<h2>Database Reports</h2><div class="grid">'+[['Total Orders',db.orders.length],['Total Weight',fmt(t.weight)+'g'],['Direct',db.orders.filter(o=>o.type==='Direct').length],['SM',db.orders.filter(o=>o.type==='SM').length],['Pending',t.pending],['Started',t.started],['Finished',t.finished],['Delivered',t.delivered],['Cancelled',t.cancelled]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="kpi">'+x[1]+'</div></div>').join('')+'</div><div class="card"><h3>Order Status Report</h3><div class="tablewrap"><table><tr><th>Date</th><th>Order</th><th>Customer</th><th>Type</th><th>Weight</th><th>Status</th></tr>'+db.orders.slice().reverse().map(o=>'<tr><td>'+esc(o.orderDate)+'</td><td>'+esc(o.orderNo)+'</td><td>'+esc(cust(o.customerId).name)+'</td><td>'+esc(o.type)+'</td><td>'+fmt(o.weight)+'g</td><td>'+badge(o.status)+'</td></tr>').join('')+'</table></div></div>'
}
function applyTemplate(t,c,o){if(!t)return '';let vars={name:c?.name||'',shop:c?.shop||'',order:o?.orderNo||'',weight:o?.weight||'',status:o?.status||'',city:c?.city||'',stall:''};return t.body.replace(/\{\{(\w+)\}\}/g,(m,k)=>vars[k]??m)}
function openWA(customerId,orderId){
let c=cust(customerId),o=orderId?ord(orderId):db.orders.filter(x=>x.customerId==customerId).slice(-1)[0],t=db.templates[0];
modal('WhatsApp Message','<div class="formgrid"><div><label>Customer</label><select id="wac" onchange="refreshWA()">'+db.customers.map(x=>'<option value="'+x.id+'" '+(x.id==customerId?'selected':'')+'>'+esc(x.name)+' — '+esc(x.mobile)+'</option>').join('')+'</select></div><div><label>Template</label><select id="wat" onchange="refreshWA()">'+db.templates.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="full"><label>Message</label><textarea id="wam" rows="9">'+esc(applyTemplate(t,c,o))+'</textarea></div></div><div class="actions"><button class="green" onclick="sendWA()">Open WhatsApp</button><button class="light" onclick="navigator.clipboard?.writeText($(\'wam\').value);toast(\'Message copied\')">Copy</button></div>')
}
function refreshWA(){let c=cust($('wac').value),o=db.orders.filter(x=>x.customerId==c.id).slice(-1)[0],t=db.templates.find(x=>x.id==$('wat').value);$('wam').value=applyTemplate(t,c,o)}
function sendWA(){let c=cust($('wac').value),n=(c.mobile||'').replace(/\D/g,'');if(n.length===10)n=(db.settings.country||'91')+n;if(n.length<10)return toast('Mobile number missing');window.open('https://wa.me/'+n+'?text='+encodeURIComponent($('wam').value),'_blank')}
function renderWhatsApp(){$('whatsapp').innerHTML='<h2>WhatsApp Center</h2><div class="card"><h3>Individual WhatsApp</h3><p class="muted">Select a customer and template, review the message, then open WhatsApp.</p><button class="green" onclick="openWA(db.customers[0]?.id)">Open Individual WhatsApp</button></div>'}
function openTemplate(id){let t=id?db.templates.find(x=>x.id===id):{name:'',body:'Dear {{name}},\\n\\n'};modal(id?'Edit Template':'New Template','<label>Template Name</label><input id="tn" value="'+esc(t.name)+'"><label>Message</label><textarea id="tb" rows="10">'+esc(t.body)+'</textarea><p class="muted">Variables: {{name}} {{shop}} {{order}} {{weight}} {{status}} {{city}} {{stall}}</p><button class="orange" onclick="saveTemplate(\''+(id||'')+'\')">Save Template</button>')}
function saveTemplate(id){let x={name:$('tn').value.trim(),body:$('tb').value};if(!x.name||!x.body)return toast('Name and message required');if(id)Object.assign(db.templates.find(t=>t.id===id),x);else db.templates.push({id:'t'+Date.now(),...x});save();closeModal();renderAll();toast('Template saved')}
function renderTemplates(){$('templates').innerHTML='<h2>Message Templates</h2><div class="actions"><button class="orange" onclick="openTemplate()">+ Add Template</button></div><div class="tiles">'+db.templates.map(t=>'<div class="tile"><h3>'+esc(t.name)+'</h3><p style="white-space:pre-wrap">'+esc(t.body)+'</p><button class="light" onclick="openTemplate(\''+esc(t.id)+'\')">Edit</button></div>').join('')+'</div>'}
function openExhibition(id){let e=id?db.exhibitions.find(x=>x.id==id):{name:'',location:'',start:'',end:'',stall:'',notes:''};modal(id?'Edit Exhibition':'New Exhibition','<div class="formgrid"><div><label>Exhibition Name *</label><input id="en" value="'+esc(e.name)+'"></div><div><label>Location</label><input id="el" value="'+esc(e.location)+'"></div><div><label>Start Date</label><input id="es" type="date" value="'+esc(e.start)+'"></div><div><label>End Date</label><input id="ee" type="date" value="'+esc(e.end)+'"></div><div><label>Stall No</label><input id="estall" value="'+esc(e.stall)+'"></div><div class="full"><label>Notes</label><textarea id="enotes">'+esc(e.notes)+'</textarea></div></div><button class="orange" onclick="saveExhibition('+(id||0)+')">Save Exhibition</button>')}
function saveExhibition(id){let x={name:$('en').value.trim(),location:$('el').value.trim(),start:$('es').value,end:$('ee').value,stall:$('estall').value.trim(),notes:$('enotes').value.trim()};if(!x.name)return toast('Exhibition name required');if(id)Object.assign(db.exhibitions.find(e=>e.id==id),x);else db.exhibitions.push({id:Date.now(),...x});save();closeModal();renderAll();toast('Exhibition saved')}
function renderExhibitions(){$('exhibitions').innerHTML='<h2>Exhibitions</h2><div class="actions"><button class="orange" onclick="openExhibition()">+ New Exhibition</button></div><div class="tiles">'+(db.exhibitions.map(e=>{let a=db.orders.filter(o=>o.exhibitionId==e.id);return '<div class="tile"><h3>'+esc(e.name)+'</h3><p>'+esc(e.location)+'<br>'+esc(e.start)+' → '+esc(e.end)+'</p><p><b>Orders:</b> '+a.length+'<br><b>Weight:</b> '+fmt(a.reduce((s,o)=>s+(+o.weight||0),0))+'g<br><b>Stall:</b> '+esc(e.stall)+'</p><button class="light" onclick="openExhibition('+e.id+')">Edit</button></div>'}).join('')||'<div class="tile">No exhibitions</div>')+'</div>'}
function renderBackup(){$('backup').innerHTML='<h2>Backup & Restore</h2><div class="card"><p>Your data is stored locally on this device/browser. Export a backup regularly.</p><div class="actions"><button class="orange" onclick="backup()">Export Backup</button><label class="btn light">Import Backup<input type="file" accept=".json" style="display:none" onchange="restoreBackup(event)"></label><button class="red" onclick="resetData()">Reset Data</button></div></div>'}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'SHREE JI CONNECT',version:db.settings.version,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}));a.download='shree-ji-connect-backup.json';a.click();toast('Backup exported')}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let p=JSON.parse(r.result),x=p.data||p;if(!x.customers||!x.orders)throw 1;db=x;save();renderAll();toast('Backup restored')}catch(z){toast('Invalid backup')}};r.readAsText(f)}
function resetData(){if(confirm('RESET ALL APP DATA? Export a backup first.')){localStorage.removeItem(KEY);location.reload()}}
function renderSettings(){$('settings').innerHTML='<h2>Settings</h2><div class="card"><div class="formgrid"><div><label>Company Name</label><input id="setCompany" value="'+esc(db.settings.company)+'"></div><div><label>Subtitle</label><input id="setSubtitle" value="'+esc(db.settings.subtitle)+'"></div><div><label>Phone</label><input id="setPhone" value="'+esc(db.settings.phone)+'"></div><div><label>WhatsApp Country Code</label><input id="setCountry" value="'+esc(db.settings.country)+'"></div><div class="full"><label>Address</label><textarea id="setAddress">'+esc(db.settings.address)+'</textarea></div><div><label>Default Order Type</label><select id="setType"><option '+(db.settings.defaultType==='Direct'?'selected':'')+'>Direct</option><option '+(db.settings.defaultType==='SM'?'selected':'')+'>SM</option></select></div><div><label>Default Status</label><select id="setStatus">'+STATUS.map(s=>'<option '+(db.settings.defaultStatus===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div><div class="actions"><button class="orange" onclick="saveSettings()">Save Settings</button></div></div><div class="card"><b>Version:</b> '+esc(db.settings.version)+'<br><span class="muted">Offline-first local database.</span></div>'}
function saveSettings(){db.settings.company=$('setCompany').value.trim();db.settings.subtitle=$('setSubtitle').value.trim();db.settings.phone=$('setPhone').value.trim();db.settings.country=$('setCountry').value.replace(/\D/g,'')||'91';db.settings.address=$('setAddress').value.trim();db.settings.defaultType=$('setType').value;db.settings.defaultStatus=$('setStatus').value;save();renderAll();toast('Settings saved')}
function renderAll(){$('brand').textContent=db.settings.company||'SHREE JI CONNECT';$('subtitle').textContent=db.settings.subtitle||'Business CRM';renderDashboard();renderCustomers();renderOrders();renderProduction();renderReports();renderWhatsApp();renderTemplates();renderExhibitions();renderBackup();renderSettings();nav()}
nav();go('dashboard');
</script>
</body>
</html>
