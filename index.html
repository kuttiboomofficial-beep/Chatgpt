<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f47b00">
<meta name="description" content="SHREE JI CONNECT - Business Class CRM">
<link rel="manifest" href="manifest.json">
<title>SHREE JI CONNECT</title>
<style>
:root{--o:#f47b00;--dark:#111;--bg:#f4f5f7;--card:#fff;--text:#171717;--muted:#70757d;--line:#e1e3e6;--green:#16863d;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;background:var(--dark);color:#fff;cursor:pointer;font-size:14px}
button:disabled{opacity:.45;cursor:not-allowed}.orange{background:var(--o)!important;color:#fff!important}.green{background:var(--green)!important}.red{background:var(--red)!important}.light{background:#eee!important;color:#222!important}
header{background:#111;color:#fff;padding:15px 17px;border-bottom:4px solid var(--o);position:sticky;top:0;z-index:30}
.brand{font-size:21px;font-weight:900}.sub{font-size:12px;color:#bbb;margin-top:3px}
nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:9px;position:sticky;top:72px;z-index:29;border-bottom:1px solid var(--line)}
nav button{background:#eee;color:#333;white-space:nowrap;padding:9px 12px}nav button.active{background:var(--o);color:#fff}
main{max-width:1200px;margin:auto;padding:15px}.page{display:none}.page.active{display:block}h2{font-size:28px;margin:8px 0 16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 8px #00000008}
.kpi{font-size:26px;font-weight:900;margin-top:6px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}
input,select,textarea{width:100%;padding:11px;border:1px solid #d7d9dd;border-radius:10px;background:#fff;font-size:14px}label{font-size:12px;font-weight:800;display:block;margin:8px 0 5px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee;font-size:13px}th{background:#f6f6f6}
.tablewrap{overflow:auto}.empty{text-align:center;padding:32px;color:#777}.status{padding:4px 8px;border-radius:20px;background:#eee;font-size:11px;font-weight:800}
.hero{background:#111;color:#fff;border-radius:16px;padding:18px}.hero p{color:#ccc}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:80;padding:12px;overflow:auto}
.modalbox{background:#fff;max-width:820px;margin:25px auto;padding:18px;border-radius:18px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:10px;display:none;z-index:100}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.preview{max-width:100%;border-radius:12px;border:1px solid #ddd}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){main{padding:10px}.formgrid,.tiles{grid-template-columns:1fr}h2{font-size:25px}.grid{grid-template-columns:repeat(2,1fr)}.kpi{font-size:21px}nav{top:69px}}
@media print{header,nav,.actions,.no-print{display:none!important}main{max-width:none;padding:0}.page{display:none!important}.page.printing{display:block!important}}
</style>
</head>
<body>
<header><div class="brand" id="brand">SHREE JI CONNECT</div><div class="sub" id="subtitle">Customer CRM • Orders • Production • WhatsApp • Reports</div></header>
<nav id="nav"></nav>
<main>
<section id="dashboard" class="page"></section>
<section id="customers" class="page"></section>
<section id="orders" class="page"></section>
<section id="production" class="page"></section>
<section id="reports" class="page"></section>
<section id="whatsapp" class="page"></section>
<section id="templates" class="page"></section>
<section id="scanner" class="page"></section>
<section id="print" class="page"></section>
<section id="exhibitions" class="page"></section>
<section id="backup" class="page"></section>
<section id="settings" class="page"></section>
<section id="menu" class="page"></section>
</main>
<div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="mt">Form</h3><button class="light" onclick="closeModal()">✕</button></div><div id="mb"></div></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY='sjc_business_v1';
const defaults={
 settings:{company:'SHREE JI GOLD CREATOR LLP',subtitle:'Customer CRM • Orders • Production • WhatsApp • Reports',phone:'',address:'',logo:'',defaultType:'Direct',defaultStatus:'Pending',country:'91',theme:'orange-black',version:'1.0.0'},
 customers:[],orders:[],exhibitions:[],
 templates:[
  ['confirm','Order Received Thank You','Dear {{name}},\\n\\nThank you for your valuable order.\\nOrder: {{order}}\\nWeight: {{weight}} g\\n\\nSHREE JI GOLD CREATOR LLP'],
  ['details','Order Details','Dear {{name}},\\n\\nOrder No: {{order}}\\nWeight: {{weight}} g\\nStatus: {{status}}\\n\\nThank you.'],
  ['started','Order Started','Dear {{name}},\\n\\nYour order {{order}} has been started in production.\\n\\nThank you.'],
  ['finished','Order Finished','Dear {{name}},\\n\\nYour order {{order}} has been finished.\\n\\nThank you.'],
  ['ready','Order Ready','Dear {{name}},\\n\\nYour order {{order}} is ready for delivery.\\n\\nThank you.'],
  ['delivery','Delivery Update','Dear {{name}},\\n\\nYour order {{order}} status is {{status}}.\\n\\nThank you.'],
  ['expo15','Exhibition Invite - 15 Days','Dear {{name}},\\n\\nWe are happy to invite you to our upcoming exhibition. Stall No: {{stall}}. We look forward to seeing you.'],
  ['expoDay','Exhibition Invite - Today','Dear {{name}},\\n\\nOur exhibition is today. Stall No: {{stall}}. Please visit us!'],
  ['visitThanks','Stall Visit Thank You','Dear {{name}},\\n\\nThank you for visiting our exhibition stall. We truly appreciate your support.'],
  ['festival','Festival Greeting','Dear {{name}},\\n\\nWarm festival wishes from SHREE JI GOLD CREATOR LLP.'],
  ['review','Review Request','Dear {{name}},\\n\\nThank you for choosing us. We would appreciate your valuable review.'],
  ['repeat','Repeat Order','Dear {{name}},\\n\\nIt is a pleasure serving you again. Please let us know if you need a repeat order.'],
  ['collection','New Collection','Dear {{name}},\\n\\nOur new collection is now available. Please contact us for details.'],
  ['follow','Follow-Up','Dear {{name}},\\n\\nJust following up regarding your order. Please let us know if you need any assistance.'],
  ['custom','Custom Message','Dear {{name}},\\n\\n']
 ].map(x=>({id:x[0],name:x[1],body:x[2]}))
};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaults);
if(!db.settings)db.settings=structuredClone(defaults.settings);
if(!db.templates?.length)db.templates=structuredClone(defaults.templates);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const cust=id=>db.customers.find(c=>String(c.id)===String(id))||{};
const ord=id=>db.orders.find(o=>String(o.id)===String(id));
const toast=t=>{$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)};
const modal=(t,b)=>{$('mt').textContent=t;$('mb').innerHTML=b;$('modal').style.display='block'};
const closeModal=()=>{$('modal').style.display='none'};
const fmt=n=>(+n||0).toFixed(3);

const menu=[
 ['dashboard','Dashboard'],['customers','Customer CRM'],['orders','Order Management'],['production','Production'],['reports','Database Reports'],
 ['whatsapp','WhatsApp Center'],['templates','Message Templates'],['scanner','Visiting Card Scanner'],['print','Print Center'],
 ['exhibitions','Exhibitions'],['backup','Backup & Restore'],['settings','Settings'],['menu','☰ Menu']
];
function buildNav(){$('nav').innerHTML=menu.map(x=>`<button data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active','printing'));$(p).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));renderAll()}
function totals(){let o=db.orders;return{weight:o.reduce((s,x)=>s+(+x.weight||0),0),pending:o.filter(x=>x.status==='Pending').length,started:o.filter(x=>x.status==='Started').length,finished:o.filter(x=>x.status==='Finished').length,cancelled:o.filter(x=>x.status==='Cancelled').length,delivered:o.filter(x=>x.status==='Delivered').length,direct:o.filter(x=>x.type==='Direct'),sm:o.filter(x=>x.type==='SM')}}

function renderDash(){
 let t=totals();
 $('dashboard').innerHTML=`<div class="hero"><b>${esc(db.settings.company)}</b><p>${esc(db.settings.subtitle)}</p></div>
 <h2>Dashboard</h2><div class="grid">${[
 ['Total Customers',db.customers.length],['Total Orders',db.orders.length],['Direct / SM',t.direct.length+' / '+t.sm.length],
 ['Total Weight',fmt(t.weight)+' g'],['Pending',t.pending],['Started',t.started],['Finished',t.finished],['Delivered',t.delivered]
 ].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="kpi">${x[1]}</div></div>`).join('')}</div>
 <div class="card"><h3>Quick Actions</h3><div class="actions"><button class="orange" onclick="openCustomer()">+ Customer</button><button class="orange" onclick="openOrder()">+ Order</button><button class="green" onclick="go('whatsapp')">WhatsApp</button><button onclick="go('scanner')">Scan Card</button><button onclick="go('reports')">Reports</button></div></div>
 <div class="card"><h3>Recent Orders</h3>${db.orders.slice().reverse().slice(0,8).map(o=>`<div style="padding:9px 0;border-bottom:1px solid #eee">${esc(o.orderNo)} — <b>${esc(cust(o.customerId).name)}</b> — ${o.weight}g — ${esc(o.status)}</div>`).join('')||'<div class="empty">No orders</div>'}</div>`;
}

function openCustomer(id){
 let c=id?cust(id):{name:'',shop:'',contactPerson:'',mobile:'',alt:'',city:'',address:'',state:'Tamil Nadu',exhibition:'',notes:'',dateAdded:new Date().toISOString().slice(0,10)};
 modal(id?'Edit Customer':'Add Customer',`<div class="formgrid">
 <div class="full"><label>Party / Customer Name *</label><input id="cn" value="${esc(c.name)}"></div>
 <div><label>Shop Name</label><input id="cshop" value="${esc(c.shop)}"></div><div><label>Contact Person</label><input id="ccp" value="${esc(c.contactPerson)}"></div>
 <div><label>Mobile *</label><input id="cm" value="${esc(c.mobile)}"></div><div><label>Alternate Mobile</label><input id="ca" value="${esc(c.alt)}"></div>
 <div><label>City</label><input id="ccity" value="${esc(c.city)}"></div><div><label>State</label><input id="cstate" value="${esc(c.state)}"></div>
 <div class="full"><label>Full Address</label><textarea id="caddr" rows="3">${esc(c.address)}</textarea></div>
 <div><label>Exhibition</label><input id="cex" value="${esc(c.exhibition)}"></div><div><label>Date Added</label><input id="cdate" type="date" value="${esc(c.dateAdded)}"></div>
 <div class="full"><label>Customer Notes</label><textarea id="cnotes">${esc(c.notes)}</textarea></div></div>
 <div class="actions"><button class="orange" onclick="saveCustomer(${id||0})">Save Customer</button></div>`);
}
function saveCustomer(id){
 let x={name:cn.value.trim(),shop:cshop.value.trim(),contactPerson:ccp.value.trim(),mobile:cm.value.trim(),alt:ca.value.trim(),city:ccity.value.trim(),state:cstate.value.trim(),address:caddr.value.trim(),exhibition:cex.value.trim(),notes:cnotes.value.trim(),dateAdded:cdate.value||new Date().toISOString().slice(0,10)};
 if(!x.name||!x.mobile)return toast('Customer name and mobile required');
 if(id)Object.assign(cust(id),x);else db.customers.push({id:Date.now(),...x});
 save();closeModal();renderAll();toast('Customer saved');
}
function delCustomer(id){if(confirm('Delete customer and linked orders?')){db.customers=db.customers.filter(c=>c.id!=id);db.orders=db.orders.filter(o=>o.customerId!=id);save();renderAll();}}
function renderCustomers(){
 let q=($('cq')?.value||'').toLowerCase(),a=db.customers.filter(c=>(c.name+' '+c.shop+' '+c.mobile+' '+c.city+' '+c.state+' '+c.exhibition).toLowerCase().includes(q));
 $('customers').innerHTML=`<h2>Customer CRM</h2><div class="actions"><button class="orange" onclick="openCustomer()">+ Add Customer</button><button onclick="go('scanner')">📇 Scan Visiting Card</button><input id="cq" placeholder="Search name / shop / mobile / city / state / exhibition" value="${esc(q)}" oninput="renderCustomers()"></div><div class="card tablewrap">${a.length?`<table><tr><th>Party</th><th>Shop</th><th>Mobile</th><th>City</th><th>Orders</th><th>Actions</th></tr>${a.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.shop||'-')}</td><td>${esc(c.mobile)}</td><td>${esc(c.city||'-')}</td><td>${db.orders.filter(o=>o.customerId==c.id).length}</td><td><button onclick="callCustomer('${esc(c.mobile)}')">Call</button> <button class="green" onclick="waCustomer(${c.id})">WA</button> <button class="light" onclick="viewCustomer(${c.id})">View</button> <button class="light" onclick="openCustomer(${c.id})">Edit</button> <button class="red" onclick="delCustomer(${c.id})">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No customers found</div>'}</div>`;
}
function callCustomer(n){if(n)location.href='tel:'+n}
function waCustomer(id){let c=cust(id);openWA(c.id)}
function viewCustomer(id){let c=cust(id),os=db.orders.filter(o=>o.customerId==id);modal('Customer Details',`<h3>${esc(c.name)}</h3><p><b>Shop:</b> ${esc(c.shop||'-')}<br><b>Mobile:</b> ${esc(c.mobile)}<br><b>Alternate:</b> ${esc(c.alt||'-')}<br><b>Address:</b> ${esc(c.address||'-')}<br><b>City:</b> ${esc(c.city||'-')}, ${esc(c.state||'')}</p><h4>Orders (${os.length})</h4>${os.map(o=>`<div style="padding:8px;border-bottom:1px solid #eee">${esc(o.orderNo)} — ${o.weight}g — ${esc(o.status)}</div>`).join('')||'No orders'}`)}

function openOrder(id){
 if(!db.customers.length)return toast('Add a customer first');
 let o=id?ord(id):{orderNo:'SJ-'+new Date().getFullYear()+'-'+String(db.orders.length+1).padStart(4,'0'),orderDate:new Date().toISOString().slice(0,10),customerId:db.customers[0].id,type:db.settings.defaultType,status:db.settings.defaultStatus,weight:'',touch:'',screw:'',ladyRing:'',gentRing:'',huid:'Yes',advanceMode:'Cash',advanceAmount:'',startDate:'',delivered:'',exhibitionId:'',notes:''};
 modal(id?'Edit Order':'New Order',`<div class="formgrid">
 <div><label>Order Number *</label><input id="ono" value="${esc(o.orderNo)}"></div><div><label>Order Date *</label><input id="od" type="date" value="${esc(o.orderDate)}"></div>
 <div><label>Customer *</label><select id="oc">${db.customers.map(c=>`<option value="${c.id}" ${c.id==o.customerId?'selected':''}>${esc(c.name)} — ${esc(c.mobile)}</option>`).join('')}</select></div>
 <div><label>Exhibition</label><select id="oex"><option value="">-- None --</option>${db.exhibitions.map(e=>`<option value="${e.id}" ${e.id==o.exhibitionId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
 <div><label>Order Type *</label><select id="ot"><option ${o.type==='Direct'?'selected':''}>Direct</option><option ${o.type==='SM'?'selected':''}>SM</option></select></div>
 <div><label>Weight (g) *</label><input id="ow" type="number" step=".001" value="${esc(o.weight)}"></div>
 <div><label>Touch *</label><input id="touch" value="${esc(o.touch)}"></div><div><label>Screw Type</label><input id="screw" value="${esc(o.screw)}"></div>
 <div><label>Lady's Ring Size</label><input id="lr" value="${esc(o.ladyRing)}"></div><div><label>Gent's Ring Size</label><input id="gr" value="${esc(o.gentRing)}"></div>
 <div><label>HUID</label><select id="huid"><option ${o.huid!=='No'?'selected':''}>Yes</option><option ${o.huid==='No'?'selected':''}>No</option></select></div>
 <div><label>Advance Mode</label><select id="am"><option ${o.advanceMode==='Cash'?'selected':''}>Cash</option><option ${o.advanceMode==='Gpay'?'selected':''}>Gpay</option><option ${o.advanceMode==='Bank'?'selected':''}>Bank</option></select></div>
 <div><label>Advance Amount (₹)</label><input id="adv" type="number" step=".01" value="${esc(o.advanceAmount)}"></div>
 <div><label>Start Date</label><input id="sd" type="date" value="${esc(o.startDate)}"></div>
 <div><label>Status</label><select id="status">${['Pending','Started','Finished','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
 <div><label>Delivered Date</label><input id="dd" type="date" value="${esc(o.delivered)}"></div>
 <div class="full"><label>Notes</label><textarea id="onotes">${esc(o.notes)}</textarea></div></div>
 <div class="actions"><button class="orange" onclick="saveOrder(${id||0})">Save Order</button></div>`);
}
function saveOrder(id){
 let x={orderNo:ono.value.trim(),orderDate:od.value,customerId:Number(oc.value),exhibitionId:oex.value?Number(oex.value):'',type:ot.value,weight:Number(ow.value)||0,touch:touch.value.trim(),screw:screw.value.trim(),ladyRing:lr.value.trim(),gentRing:gr.value.trim(),huid:huid.value,advanceMode:am.value,advanceAmount:Number(adv.value)||0,startDate:sd.value,status:status.value,delivered:dd.value,notes:onotes.value.trim()};
 if(!x.orderNo||!x.orderDate||!x.weight||!x.touch)return toast('Order No, date, weight and touch are required');
 if(id)Object.assign(ord(id),x);else db.orders.push({id:Date.now(),...x});
 if(x.status==='Delivered'&&!x.delivered)x.delivered=new Date().toISOString().slice(0,10);
 save();closeModal();renderAll();toast('Order saved');
}
function delOrder(id){if(confirm('Delete this order?')){db.orders=db.orders.filter(o=>o.id!=id);save();renderAll()}}
function copyOrder(id){let o=ord(id),c=cust(o.customerId);let s=`Order: ${o.orderNo}\nCustomer: ${c.name}\nMobile: ${c.mobile}\nType: ${o.type}\nWeight: ${o.weight} g\nTouch: ${o.touch}\nScrew: ${o.screw}\nLady Ring: ${o.ladyRing||'-'}\nGent Ring: ${o.gentRing||'-'}\nHUID: ${o.huid}\nAdvance: ₹${o.advanceAmount||0} (${o.advanceMode})\nStatus: ${o.status}`;navigator.clipboard?.writeText(s);toast('Order details copied')}

function renderOrders(){
 let q=($('oq')?.value||'').toLowerCase(),type=$('ofType')?.value||'',st=$('ofStatus')?.value||'',a=db.orders.filter(o=>(o.orderNo+' '+cust(o.customerId).name+' '+cust(o.customerId).shop+' '+cust(o.customerId).mobile+' '+o.status).toLowerCase().includes(q)&&(!type||o.type===type)&&(!st||o.status===st));
 $('orders').innerHTML=`<h2>Order Management</h2><div class="actions"><button class="orange" onclick="openOrder()">+ Manual Order</button><input id="oq" placeholder="Search order / customer / shop / mobile" value="${esc(q)}" oninput="renderOrders()"><select id="ofType" onchange="renderOrders()"><option value="">All Types</option><option ${type==='Direct'?'selected':''}>Direct</option><option ${type==='SM'?'selected':''}>SM</option></select><select id="ofStatus" onchange="renderOrders()"><option value="">All Status</option>${['Pending','Started','Finished','Delivered','Cancelled'].map(s=>`<option ${st===s?'selected':''}>${s}</option>`).join('')}</select></div>
 <div class="card tablewrap">${a.length?`<table><tr><th>Order</th><th>Date</th><th>Party</th><th>Type</th><th>Weight</th><th>Status</th><th>Actions</th></tr>${a.slice().reverse().map(o=>`<tr><td>${esc(o.orderNo)}</td><td>${esc(o.orderDate)}</td><td>${esc(cust(o.customerId).name)}</td><td>${o.type}</td><td>${fmt(o.weight)}g</td><td><span class="status">${esc(o.status)}</span></td><td><button class="light" onclick="openOrder(${o.id})">Edit</button><button onclick="copyOrder(${o.id})">Copy</button><button class="green" onclick="openWA(${o.customerId},${o.id})">WA</button><button onclick="printOrder(${o.id})">Print</button><button class="red" onclick="delOrder(${o.id})">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No orders found</div>'}</div>`;
}

function productionBlock(type){
 let a=db.orders.filter(o=>o.type===type),finished=a.filter(o=>o.status==='Finished'),started=a.filter(o=>o.status==='Started'),pending=a.filter(o=>o.status==='Pending'),weight=a.reduce((s,o)=>s+(+o.weight||0),0);
 let rows=list=>list.map(o=>`<tr><td>${esc(o.orderNo)}</td><td>${esc(cust(o.customerId).name)}</td><td>${fmt(o.weight)}g</td><td>${esc(o.touch)}</td><td><select onchange="setStatus(${o.id},this.value)">${['Pending','Started','Finished','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No orders</td></tr>';
 return `<div class="card"><h3>${type} Production</h3><div class="grid"><div class="card"><div class="muted">Total Orders</div><div class="kpi">${a.length}</div></div><div class="card"><div class="muted">Weight</div><div class="kpi">${fmt(weight)}g</div></div><div class="card"><div class="muted">Finished Orders & Weight</div><div class="kpi">${finished.length} / ${fmt(finished.reduce((s,o)=>s+(+o.weight||0),0))}g</div></div><div class="card"><div class="muted">Process / Pending</div><div class="kpi">${started.length} / ${pending.length}</div></div></div>
 <h4>Started / Process</h4><div class="tablewrap"><table><tr><th>Order</th><th>Party</th><th>Weight</th><th>Touch</th><th>Status</th></tr>${rows(started)}</table></div>
 <h4>Finished</h4><div class="tablewrap"><table><tr><th>Order</th><th>Party</th><th>Weight</th><th>Touch</th><th>Status</th></tr>${rows(finished)}</table></div>
 <h4>Pending / Not Started</h4><div class="tablewrap"><table><tr><th>Order</th><th>Party</th><th>Weight</th><th>Touch</th><th>Status</th></tr>${rows(pending)}</table></div></div>`;
}
function setStatus(id,s){let o=ord(id);o.status=s;if(s==='Delivered'&&!o.delivered)o.delivered=new Date().toISOString().slice(0,10);save();renderAll();toast('Status updated')}
function renderProduction(){$('production').innerHTML='<h2>Production Status</h2>'+productionBlock('Direct')+productionBlock('SM')}

function applyTemplate(t,c,o,extra={}){return(t?.body||'').replaceAll('{{name}}',c.name||'Customer').replaceAll('{{shop}}',c.shop||'').replaceAll('{{order}}',o?.orderNo||'').replaceAll('{{weight}}',o?.weight||'').replaceAll('{{status}}',o?.status||'').replaceAll('{{city}}',c.city||'').replaceAll('{{stall}}',extra.stall||'')}
function openWA(customerId,orderId){
 let c=cust(customerId),o=orderId?ord(orderId):db.orders.filter(x=>x.customerId==customerId).slice(-1)[0];
 modal('WhatsApp Message',`<div class="formgrid"><div><label>Customer</label><select id="wac" onchange="refreshWAModal()">${db.customers.map(x=>`<option value="${x.id}" ${x.id==customerId?'selected':''}>${esc(x.name)} — ${esc(x.mobile)}</option>`).join('')}</select></div><div><label>Template</label><select id="wat" onchange="refreshWAModal()">${db.templates.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></div><div class="full"><label>Message</label><textarea id="wam" rows="10">${esc(applyTemplate(db.templates[0],c,o))}</textarea></div></div><div class="actions"><button class="green" onclick="sendWAModal()">Open WhatsApp</button><button class="light" onclick="copyWAModal()">Copy</button></div>`);
}
function refreshWAModal(){let c=cust($('wac').value),o=db.orders.filter(x=>x.customerId==c.id).slice(-1)[0],t=db.templates.find(x=>x.id==$('wat').value);$('wam').value=applyTemplate(t,c,o)}
function sendWAModal(){let c=cust($('wac').value),n=(c.mobile||'').replace(/\D/g,'');if(n.length===10)n=(db.settings.country||'91')+n;if(n.length<10)return toast('Mobile number missing');window.open('https://wa.me/'+n+'?text='+encodeURIComponent($('wam').value),'_blank')}
async function copyWAModal(){try{await navigator.clipboard.writeText($('wam').value);toast('Message copied')}catch(e){toast('Copy unavailable')}}
let bulkSel=new Set();
function renderWhatsApp(){
 $('whatsapp').innerHTML=`<h2>WhatsApp Center</h2><div class="card"><h3>Individual WhatsApp</h3><p class="muted">Select a customer, choose a template, review the message and open WhatsApp.</p><button class="green" onclick="openWA(db.customers[0]?.id)">Open Individual WhatsApp</button></div>
 <div class="card"><h3>Bulk WhatsApp — Maximum 25</h3><div class="formgrid"><div><label>Template</label><select id="bt">${db.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div><label>Search</label><input id="bq" placeholder="Search customer" oninput="renderBulkList()"></div></div><div class="actions"><button class="orange" onclick="selectBulk(true)">Select All (max 25)</button><button class="light" onclick="selectBulk(false)">Clear All</button><button class="green" onclick="nextBulk()">Open Next WhatsApp</button></div><p id="bc" class="muted"></p><div id="bl"></div></div>
 <div class="card"><h3>Image Sending</h3><p class="muted">Choose an image and use it in WhatsApp. Final sending is confirmed in WhatsApp.</p><input type="file" accept="image/*" id="waImage"><div id="imagePreview"></div></div>`;
 renderBulkList();
}
function renderBulkList(){let q=($('bq')?.value||'').toLowerCase(),a=db.customers.filter(c=>(c.name+' '+c.shop+' '+c.mobile+' '+c.city).toLowerCase().includes(q));$('bc').textContent=bulkSel.size+' / 25 selected';$('bl').innerHTML=a.map(c=>`<label style="display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #eee"><input type="checkbox" ${bulkSel.has(String(c.id))?'checked':''} onchange="toggleBulk(${c.id},this.checked)"><span><b>${esc(c.name)}</b><br><span class="muted">${esc(c.mobile)}${c.city?' · '+esc(c.city):''}</span></span></label>`).join('')||'<div class="empty">No customers</div>'}
function toggleBulk(id,on){if(on){if(bulkSel.size>=25)return toast('Maximum 25 customers');bulkSel.add(String(id))}else bulkSel.delete(String(id));renderBulkList()}
function selectBulk(on){bulkSel=on?new Set(db.customers.slice(0,25).map(c=>String(c.id))):new Set();renderBulkList()}
function nextBulk(){let ids=[...bulkSel];let i=+(localStorage.getItem('sjc_bulk_index')||0);if(i>=ids.length)i=0;if(!ids.length)return toast('Select customers first');let c=cust(ids[i]),o=db.orders.filter(x=>x.customerId==c.id).slice(-1)[0],t=db.templates.find(x=>x.id==$('bt').value)||db.templates[0],n=(c.mobile||'').replace(/\D/g,'');if(n.length===10)n=(db.settings.country||'91')+n;if(n.length<10)return toast('Mobile missing: '+c.name);localStorage.setItem('sjc_bulk_index',String(i+1));window.open('https://wa.me/'+n+'?text='+encodeURIComponent(applyTemplate(t,c,o)),'_blank');toast('Opened '+c.name)}

function openTemplate(id){let t=id?db.templates.find(x=>x.id===id):{name:'',body:'Dear {{name}},\\n\\n'};modal(id?'Edit Template':'New Template',`<label>Template Name *</label><input id="tn" value="${esc(t.name)}"><label>Template Message *</label><textarea id="tb" rows="11">${esc(t.body)}</textarea><p class="muted">Variables: {{name}} {{shop}} {{order}} {{weight}} {{status}} {{city}} {{stall}}</p><button class="orange" onclick="saveTemplate('${id||''}')">Save Template</button>`)}
function saveTemplate(id){let x={name:tn.value.trim(),body:tb.value};if(!x.name||!x.body)return toast('Template name and message required');if(id)Object.assign(db.templates.find(t=>t.id===id),x);else db.templates.push({id:'t'+Date.now(),...x});save();closeModal();renderAll();toast('Template saved')}
function delTemplate(id){if(confirm('Delete this template?')){db.templates=db.templates.filter(t=>t.id!==id);save();renderAll()}}
function renderTemplates(){$('templates').innerHTML=`<h2>Message Templates</h2><div class="actions"><button class="orange" onclick="openTemplate()">+ Add Template</button></div><div class="tiles">${db.templates.map(t=>`<div class="tile"><h3>${esc(t.name)}</h3><p style="white-space:pre-wrap">${esc(t.body)}</p><button class="light" onclick="openTemplate('${esc(t.id)}')">Edit</button> <button class="red" onclick="delTemplate('${esc(t.id)}')">Delete</button></div>`).join('')}</div>`}

function openExhibition(id){let e=id?db.exhibitions.find(x=>x.id==id):{name:'',location:'',start:'',end:'',stall:'',notes:''};modal(id?'Edit Exhibition':'New Exhibition',`<div class="formgrid"><div><label>Exhibition Name *</label><input id="en" value="${esc(e.name)}"></div><div><label>Location</label><input id="el" value="${esc(e.location)}"></div><div><label>Start Date</label><input id="es" type="date" value="${esc(e.start)}"></div><div><label>End Date</label><input id="ee" type="date" value="${esc(e.end)}"></div><div><label>Stall No</label><input id="estall" value="${esc(e.stall)}"></div><div class="full"><label>Exhibition Notes</label><textarea id="enotes">${esc(e.notes)}</textarea></div></div><button class="orange" onclick="saveExhibition(${id||0})">Save Exhibition</button>`)}
function saveExhibition(id){let x={name:en.value.trim(),location:el.value.trim(),start:es.value,end:ee.value,stall:estall.value.trim(),notes:enotes.value.trim()};if(!x.name)return toast('Exhibition name required');if(id)Object.assign(db.exhibitions.find(e=>e.id==id),x);else db.exhibitions.push({id:Date.now(),...x});save();closeModal();renderAll();toast('Exhibition saved')}
function delExhibition(id){if(confirm('Delete this exhibition?')){db.exhibitions=db.exhibitions.filter(e=>e.id!=id);db.orders.forEach(o=>{if(o.exhibitionId==id)o.exhibitionId='' });save();renderAll()}}
function exhibitionReport(id){let e=db.exhibitions.find(x=>x.id==id),a=db.orders.filter(o=>o.exhibitionId==id),w=a.reduce((s,o)=>s+(+o.weight||0),0);modal('Exhibition Report',`<h3>${esc(e.name)}</h3><p>${esc(e.location)} · ${esc(e.start)} → ${esc(e.end)}</p><div class="grid"><div class="card">Customers<div class="kpi">${new Set(a.map(o=>o.customerId)).size}</div></div><div class="card">Orders<div class="kpi">${a.length}</div></div><div class="card">Weight<div class="kpi">${fmt(w)}g</div></div><div class="card">Direct / SM<div class="kpi">${a.filter(o=>o.type==='Direct').length} / ${a.filter(o=>o.type==='SM').length}</div></div></div><div class="actions"><button onclick="printExhibition(${id})">Print Exhibition Report</button></div>`)}
function printExhibition(id){let e=db.exhibitions.find(x=>x.id==id),a=db.orders.filter(o=>o.exhibitionId==id);printHtml('Exhibition Report',`<h2>${esc(e.name)}</h2><p>${esc(e.location)} | ${esc(e.start)} → ${esc(e.end)}</p><table><tr><th>Order</th><th>Customer</th><th>Type</th><th>Weight</th><th>Status</th></tr>${a.map(o=>`<tr><td>${esc(o.orderNo)}</td><td>${esc(cust(o.customerId).name)}</td><td>${o.type}</td><td>${fmt(o.weight)}g</td><td>${esc(o.status)}</td></tr>`).join('')}</table>`)}
function renderExhibitions(){$('exhibitions').innerHTML=`<h2>Exhibitions</h2><div class="actions"><button class="orange" onclick="openExhibition()">+ New Exhibition</button></div><div class="tiles">${db.exhibitions.map(e=>{let a=db.orders.filter(o=>o.exhibitionId==e.id);return `<div class="tile"><h3>${esc(e.name)}</h3><p class="muted">${esc(e.location)}<br>${esc(e.start)} → ${esc(e.end)}</p><p><b>Customers:</b> ${new Set(a.map(o=>o.customerId)).size}<br><b>Weight:</b> ${fmt(a.reduce((s,o)=>s+(+o.weight||0),0))}g<br><b>Direct / SM:</b> ${a.filter(o=>o.type==='Direct').length} / ${a.filter(o=>o.type==='SM').length}</p><button onclick="exhibitionReport(${e.id})">View Report</button> <button class="light" onclick="openExhibition(${e.id})">Edit</button> <button class="red" onclick="delExhibition(${e.id})">Delete</button></div>`}).join('')||'<div class="empty">No exhibitions</div>'}</div>`}

function reportData(){
 let q=($('rq')?.value||'').toLowerCase(),type=$('rt')?.value||'',statusF=$('rs')?.value||'',from=$('rf')?.value||'',to=$('rto')?.value||'';
 let a=db.orders.filter(o=>{let c=cust(o.customerId),text=(o.orderNo+' '+c.name+' '+c.shop+' '+c.mobile+' '+c.city+' '+c.state).toLowerCase();return text.includes(q)&&(!type||o.type===type)&&(!statusF||o.status===statusF)&&(!from||o.orderDate>=from)&&(!to||o.orderDate<=to)});
 return a;
}
function renderReports(){
 let t=totals(),a=reportData();$('reports').innerHTML=`<h2>Database Reports</h2><div class="grid">${[['Total Orders',db.orders.length],['Total Weight',fmt(t.weight)+'g'],['Direct Summary',t.direct.length+' / '+fmt(t.direct.reduce((s,o)=>s+(+o.weight||0),0))+'g'],['SM Summary',t.sm.length+' / '+fmt(t.sm.reduce((s,o)=>s+(+o.weight||0),0))+'g'],['Pending',t.pending],['Started',t.started],['Finished',t.finished],['Cancelled',t.cancelled]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="kpi">${x[1]}</div></div>`).join('')}</div>
 <div class="card"><h3>Search / Filter</h3><div class="formgrid"><div class="full"><input id="rq" placeholder="Customer / shop / mobile / order / city / state" value="${esc($('rq')?.value||'')}" oninput="renderReports()"></div><div><select id="rt" onchange="renderReports()"><option value="">Direct + SM</option><option ${($('rt')?.value==='Direct')?'selected':''}>Direct</option><option ${($('rt')?.value==='SM')?'selected':''}>SM</option></select></div><div><select id="rs" onchange="renderReports()"><option value="">All Status</option>${['Pending','Started','Finished','Delivered','Cancelled'].map(s=>`<option ${($('rs')?.value===s)?'selected':''}>${s}</option>`).join('')}</select></div><div><label>From Date</label><input id="rf" type="date" value="${esc($('rf')?.value||'')}" onchange="renderReports()"></div><div><label>To Date</label><input id="rto" type="date" value="${esc($('rto')?.value||'')}" onchange="renderReports()"></div></div><div class="actions"><button onclick="exportCSV(a)">Export CSV</button><button onclick="printReport()">Print Report</button></div></div>
 <div class="card tablewrap"><h3>Customer Summary</h3>${customerSummary(a)}<h3>Date-wise / Order Report</h3>${a.length?`<table><tr><th>Date</th><th>Order</th><th>Customer</th><th>Type</th><th>Weight</th><th>Status</th></tr>${a.map(o=>`<tr><td>${esc(o.orderDate)}</td><td>${esc(o.orderNo)}</td><td>${esc(cust(o.customerId).name)}</td><td>${o.type}</td><td>${fmt(o.weight)}g</td><td>${esc(o.status)}</td></tr>`).join('')}</table>`:'<div class="empty">No matching orders</div>'}</div>`;
}
function customerSummary(a){let m={};a.forEach(o=>{let id=o.customerId;m[id]??={c:cust(id),n:0,w:0};m[id].n++;m[id].w+=(+o.weight||0)});let rows=Object.values(m);return rows.length?`<table><tr><th>Customer</th><th>Orders</th><th>Weight</th></tr>${rows.map(x=>`<tr><td>${esc(x.c.name)}</td><td>${x.n}</td><td>${fmt(x.w)}g</td></tr>`).join('')}</table>`:'<div class="empty">No customer summary</div>'}
function printReport(){let a=reportData();printHtml('Database Report',`<h2>Database Report</h2><p>Generated: ${new Date().toLocaleString()}</p><table><tr><th>Date</th><th>Order</th><th>Customer</th><th>Type</th><th>Weight</th><th>Status</th></tr>${a.map(o=>`<tr><td>${esc(o.orderDate)}</td><td>${esc(o.orderNo)}</td><td>${esc(cust(o.customerId).name)}</td><td>${o.type}</td><td>${fmt(o.weight)}g</td><td>${esc(o.status)}</td></tr>`).join('')}</table>`)}
function exportCSV(a=db.orders){let r=[['Order No','Date','Customer','Shop','Mobile','Type','Weight','Touch','Screw','Lady Ring','Gent Ring','HUID','Advance Mode','Advance Amount','Status','Start Date','Delivered Date','Exhibition'],...a.map(o=>{let c=cust(o.customerId),e=db.exhibitions.find(x=>x.id==o.exhibitionId);return[o.orderNo,o.orderDate,c.name,c.shop,c.mobile,o.type,o.weight,o.touch,o.screw,o.ladyRing,o.gentRing,o.huid,o.advanceMode,o.advanceAmount,o.status,o.startDate,o.delivered,e?.name||'']})];let csv=r.map(row=>row.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\\n');let aEl=document.createElement('a');aEl.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));aEl.download='shree-ji-database-report.csv';aEl.click()}

function printHtml(title,body){let w=window.open('','_blank');if(!w)return toast('Popup blocked');w.document.write(`<html><head><title>${esc(title)}</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #ddd;text-align:left}</style></head><body><h2>${esc(db.settings.company)}</h2>${body}<script>window.print()<\\/script></body></html>`);w.document.close()}
function printOrder(id){let o=ord(id),c=cust(o.customerId),e=db.exhibitions.find(x=>x.id==o.exhibitionId);printHtml('Order Slip',`<h3>Order ${esc(o.orderNo)}</h3><p><b>Customer:</b> ${esc(c.name)}<br><b>Shop:</b> ${esc(c.shop||'-')}<br><b>Mobile:</b> ${esc(c.mobile)}<br><b>Address:</b> ${esc(c.address||'-')}<br><b>Exhibition:</b> ${esc(e?.name||'-')}<br><b>Date:</b> ${esc(o.orderDate)}<br><b>Type:</b> ${o.type}<br><b>Weight:</b> ${fmt(o.weight)}g<br><b>Touch:</b> ${esc(o.touch)}<br><b>Screw:</b> ${esc(o.screw)}<br><b>Lady Ring:</b> ${esc(o.ladyRing||'-')}<br><b>Gent Ring:</b> ${esc(o.gentRing||'-')}<br><b>HUID:</b> ${esc(o.huid)}<br><b>Advance:</b> ₹${esc(o.advanceAmount||0)} (${esc(o.advanceMode)})<br><b>Status:</b> ${esc(o.status)}<br><b>Start:</b> ${esc(o.startDate||'-')}<br><b>Delivered:</b> ${esc(o.delivered||'-')}</p><p><b>Notes:</b> ${esc(o.notes||'-')}</p>`)}
function renderPrint(){$('print').innerHTML=`<h2>Print Center</h2><div class="card"><label>Order</label><select id="po">${db.orders.slice().reverse().map(o=>`<option value="${o.id}">${esc(o.orderNo)} — ${esc(cust(o.customerId).name)}</option>`).join('')||'<option value="">No orders</option>'}</select><div class="actions"><button class="orange" onclick="printOrder($('po').value)">Print Order</button><button onclick="printReport()">Print Filtered Report</button></div></div><div class="tiles"><div class="tile"><h3>Print Options</h3><p>Customer, Order, Order Details, Customer + Orders, Pending, Started, Finished, Direct, SM, Exhibition and Summary are available through the reports/order print functions.</p></div><div class="tile"><h3>A4 / Mobile</h3><p>Print layouts use responsive HTML and browser print preview.</p></div><div class="tile"><h3>Preview</h3><p>Browser print preview opens before printing.</p></div></div>`}

let scanFile=null;
function renderScanner(){$('scanner').innerHTML=`<h2>Visiting Card Scanner</h2><div class="card"><p class="muted">Camera/upload → OCR → review → save. OCR supports multiple languages available in the loaded Tesseract language pack; English output is the default business form. Translation of non-English text requires an online translation service.</p><div class="formgrid"><div><label>Camera / Upload Image</label><input id="cardFile" type="file" accept="image/*" capture="environment" onchange="previewCard(event)"><img id="cardImg" class="preview" style="display:none;margin-top:10px"></div><div><label>Shop Name</label><input id="snshop"><label>Customer Name</label><input id="sn"><label>Mobile</label><input id="sm"><label>Alternate Mobile</label><input id="sa"><label>City</label><input id="sc"></div><div class="full"><label>Full Address</label><textarea id="saddr" rows="4"></textarea></div><div class="full"><label>Detected Text</label><textarea id="ocrText" rows="6" readonly></textarea><div id="ocrStatus" class="muted"></div></div></div><div class="actions"><button class="orange" id="scanBtn" onclick="scanCard()" disabled>🔍 Scan Card</button><button class="light" onclick="clearScan()">Clear</button><button class="green" onclick="saveScan()">Save as Customer</button></div></div>`}
function previewCard(e){scanFile=e.target.files[0]||null;if(!scanFile)return;let r=new FileReader();r.onload=()=>{$('cardImg').src=r.result;$('cardImg').style.display='block';$('scanBtn').disabled=false;$('ocrStatus').textContent='Photo ready.'};r.readAsDataURL(scanFile)}
async function scanCard(){if(!scanFile)return;if(!window.Tesseract)return toast('OCR library unavailable');$('scanBtn').disabled=true;$('ocrStatus').textContent='Scanning...';try{let r=await Tesseract.recognize(scanFile,'eng',{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent='Scanning '+Math.round((m.progress||0)*100)+'%'}});let text=r.data.text||'';$('ocrText').value=text;let lines=text.split(/\\n/).map(x=>x.trim()).filter(Boolean),phones=[...text.matchAll(/(?:\\+?91[\\s-]?)?[6-9]\\d{4}[\\s-]?\\d{5}/g)].map(x=>x[0]);$('sm').value=(phones[0]||'').replace(/\\D/g,'').slice(-10);$('sa').value=(phones[1]||'').replace(/\\D/g,'').slice(-10);let bad=/phone|mobile|email|www|road|street|address|india|gold|jewell|llp|pvt|ltd/i;let candidates=lines.filter(x=>x.length>2&&!bad.test(x)&&!/[0-9@]/.test(x));$('sn').value=candidates[0]||'';$('snshop').value=candidates[1]||'';$('saddr').value=lines.filter(x=>x!==$('sn').value&&x!==$('snshop').value).join(', ');$('ocrStatus').textContent='Scan complete. Review before saving.'}catch(e){$('ocrStatus').textContent='OCR failed. Try a clearer image.'}finally{$('scanBtn').disabled=false}}
function clearScan(){scanFile=null;if($('cardFile'))$('cardFile').value='';['snshop','sn','sm','sa','sc','saddr','ocrText'].forEach(id=>{if($(id))$(id).value=''});if($('cardImg')){$('cardImg').style.display='none';$('cardImg').removeAttribute('src')}if($('scanBtn'))$('scanBtn').disabled=true;if($('ocrStatus'))$('ocrStatus').textContent=''}
function saveScan(){if(!$('sn').value.trim()||!$('sm').value.trim())return toast('Name and mobile required');db.customers.push({id:Date.now(),name:$('sn').value.trim(),shop:$('snshop').value.trim(),contactPerson:'',mobile:$('sm').value.trim(),alt:$('sa').value.trim(),city:$('sc').value.trim(),address:$('saddr').value.trim(),state:'',exhibition:'',notes:'From visiting card scanner',dateAdded:new Date().toISOString().slice(0,10)});save();toast('Customer saved');clearScan();go('customers')}

function backup(){let payload={app:'SHREE JI CONNECT',version:db.settings.version,exportedAt:new Date().toISOString(),data:db};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='shree-ji-connect-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded')}
function restoreFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let p=JSON.parse(r.result),x=p.data||p;if(!x.customers||!x.orders)throw 1;if(!confirm('Restore this backup? Current local data will be replaced. Make a backup first.'))return;db=x;save();renderAll();toast('Data restored')}catch(z){toast('Invalid backup')}};r.readAsText(f)}
function renderBackup(){$('backup').innerHTML=`<h2>Backup & Restore</h2><div class="card"><p>Your data is stored locally in this browser/device. Export backups regularly.</p><div class="actions"><button class="orange" onclick="backup()">Export / Download Backup</button><label class="btn light">Import Backup<input type="file" accept=".json" style="display:none" onchange="restoreFile(event)"></label><button class="red" onclick="resetData()">Reset Data</button></div><p class="muted">Backup includes all Customers, Orders, Templates, Exhibitions and Settings.</p></div>`}
function resetData(){if(confirm('RESET ALL APP DATA? This cannot be undone. Export a backup first.')){localStorage.removeItem(KEY);location.reload()}}

function saveSettings(){db.settings.company=$('setCompany').value.trim();db.settings.subtitle=$('setSubtitle').value.trim();db.settings.phone=$('setPhone').value.trim();db.settings.address=$('setAddress').value.trim();db.settings.defaultType=$('setType').value;db.settings.defaultStatus=$('setStatus').value;db.settings.country=$('setCountry').value.replace(/\\D/g,'')||'91';save();renderAll();toast('Settings saved')}
function renderSettings(){$('settings').innerHTML=`<h2>Settings</h2><div class="card"><div class="formgrid"><div><label>Company Name</label><input id="setCompany" value="${esc(db.settings.company)}"></div><div><label>Company Subtitle</label><input id="setSubtitle" value="${esc(db.settings.subtitle)}"></div><div><label>Company Phone</label><input id="setPhone" value="${esc(db.settings.phone)}"></div><div><label>WhatsApp Country Code</label><input id="setCountry" value="${esc(db.settings.country)}"></div><div class="full"><label>Company Address</label><textarea id="setAddress">${esc(db.settings.address)}</textarea></div><div><label>Default Order Type</label><select id="setType"><option ${db.settings.defaultType==='Direct'?'selected':''}>Direct</option><option ${db.settings.defaultType==='SM'?'selected':''}>SM</option></select></div><div><label>Default Status</label><select id="setStatus">${['Pending','Started','Finished','Delivered','Cancelled'].map(s=>`<option ${db.settings.defaultStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Theme</label><input value="Orange + Black Professional" disabled></div><div><label>App Version</label><input value="${esc(db.settings.version)}" disabled></div><div class="full"><label>Logo</label><input type="file" accept="image/*" onchange="setLogo(event)">${db.settings.logo?'<img src="'+db.settings.logo+'" class="preview" style="max-height:80px;margin-top:8px">':''}</div></div><div class="actions"><button class="orange" onclick="saveSettings()">Save Settings</button><button onclick="go('backup')">Backup & Restore</button><button class="red" onclick="resetData()">Reset Data</button></div></div><div class="card"><h3>About App</h3><p>SHREE JI CONNECT — Business Class CRM<br>Version ${esc(db.settings.version)}<br>Offline-first local database.</p></div>`}
function setLogo(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db.settings.logo=r.result;save();renderSettings()};r.readAsDataURL(f)}

function renderMenu(){$('menu').innerHTML=`<h2>Menu</h2><div class="tiles">${menu.filter(x=>x[0]!=='menu').map(x=>`<div class="tile"><h3>${x[1]}</h3><button class="orange" onclick="go('${x[0]}')">Open</button></div>`).join('')}</div>`}

let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
async function installApp(){if(!deferredInstall)return toast('Use browser menu → Add to Home screen / Install app');deferredInstall.prompt();deferredInstall=null}
function renderAppInstall(){/* handled from menu/settings; PWA manifest+SW are included in package */}

function renderAll(){
 $('brand').textContent=db.settings.company||'SHREE JI CONNECT';$('subtitle').textContent=db.settings.subtitle||'Business CRM';
 if(db.settings.logo){$('brand').innerHTML='<img src="'+db.settings.logo+'" style="height:28px;vertical-align:middle;margin-right:8px;border-radius:5px">'+esc(db.settings.company||'SHREE JI CONNECT')}
 renderDash();renderCustomers();renderOrders();renderProduction();renderReports();renderWhatsApp();renderTemplates();renderScanner();renderPrint();renderExhibitions();renderBackup();renderSettings();renderMenu();
}
buildNav();go('dashboard');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
